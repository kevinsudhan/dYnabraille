; Pin finder: its own little PlatformIO project so it never mixes with the main firmware.
; From this folder (firmware/tools):
;   ..\.pio-venv\Scripts\pio run -t upload        build + flash
;   ..\.pio-venv\Scripts\pio device monitor       talk to it (115200 baud)
; Arduino IDE: open pin_finder/pin_finder.ino instead.
[platformio]
src_dir = pin_finder

[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
; This board's USB chip wires DTR/RTS to BOOT/EN; toggling them when the monitor
; opens drops the ESP32 into its bootloader. Leave them alone (press EN to reboot).
monitor_dtr = 0
monitor_rts = 0
