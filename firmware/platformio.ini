; DynaBraille firmware — PlatformIO project.
;   pio run -t upload        build + flash (USB)
;   pio device monitor       serial log at 115200
; The same sources open in the Arduino IDE (dynabraille_esp32/dynabraille_esp32.ino).

[platformio]
src_dir = dynabraille_esp32
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; This board's USB chip wires DTR/RTS to BOOT/EN; toggling them when the monitor
; opens drops the ESP32 into its bootloader. Leave them alone (press EN to reboot).
monitor_dtr = 0
monitor_rts = 0
; WiFi + mDNS + WebSockets outgrow the default 1.25 MB app slot.
; Arduino IDE: Tools > Partition Scheme > "Minimal SPIFFS (1.9MB APP with OTA)".
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  links2004/WebSockets@^2.6.1

; ESP32 DevKit V1 (ESP32-WROOM-32, 30 pins) — the board in this build.
; espressif32 8.x = Arduino-ESP32 core 3.3, the same core the Arduino IDE installs.
[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
